<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyecto CRUD</title>
  <link rel="stylesheet" href="./estilos.css" />
</head>
<body>
  <div class="logo-container">
    <img src="/image/movil.png" width="300" height="200" />
  </div>

  <h1>INDUSTRIAS TECNOLÓGICAS MÓVILES</h1>

  <div class="container">
    <form> 
        <legend>PRODUCTO</legend>
        <input type="text" class="form-control" id="item" placeholder="Nombre del producto" />

        <legend>PRECIO</legend>
        <input type="number" step="0.02" class="form-control" id="precio" placeholder="Precio" />

        <div class="button-group">
          <button type="button" id="crear" class="btn">Crear tabla</button>
          <button type="button" id="Insertar" class="btn">Insertar registro</button>
          <button type="button" id="Modificar" class="btn">Modificar registro</button>
          <button type="button" id="Lista" class="btn">Actualizar datos</button>
          <button type="button" id="BorrarTodo" class="btn">Eliminar todo</button>
        </div>
      </fieldset>
    </form>

    <hr />

    <h3>Lista de los productos</h3>
    <table class="tabla-productos" id="lista-de-productos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Producto</th>
          <th>Precio</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="./crud.js"></script>
</body>
</html>
